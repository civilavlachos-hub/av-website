<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" width="1280" height="1100" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <title>Πώς δουλεύει το site του γραφείου</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .h { font-size: 19px; font-weight: 700; fill: #1f2328; }
      .t { font-size: 15px; fill: #31363d; }
      .s { font-size: 13px; fill: #57606a; }
      .m { font-size: 13px; font-family: Consolas, 'Cascadia Mono', monospace; fill: #1f2328; }
      .b { font-weight: 700; }
      .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #57606a; }
      .ln { stroke: #57606a; stroke-width: 2.2; fill: none; marker-end: url(#arr); }
      .dl { stroke: #57606a; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arr); }
      .lbl { font-size: 13px; fill: #57606a; font-style: italic; }
    </style>
  </defs>

  <rect width="1280" height="1100" fill="#f7f4ee"/>

  <!-- Τίτλος -->
  <text x="30" y="50" font-size="28" font-weight="700" fill="#1f2328">Πώς δουλεύει το site του γραφείου</text>
  <text x="30" y="78" class="t">Μία αποθήκη: το GitHub. Υλικό για νέα έργα: ο κοινός φάκελος στο NAS. Όλα τα άλλα γίνονται μόνα τους.</text>

  <!-- Στήλες -->
  <text x="30" y="122" class="k">1. ΥΛΙΚΟ (NAS)</text>
  <text x="360" y="122" class="k">2. ΑΛΛΑΖΕΙΣ ΤΟ SITE</text>
  <text x="740" y="122" class="k">3. ΑΠΟΘΗΚΗ</text>
  <text x="1000" y="122" class="k">4. ONLINE</text>

  <!-- NAS -->
  <rect x="30" y="136" width="290" height="344" rx="14" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
  <rect x="30" y="136" width="8" height="344" rx="4" fill="#b45309"/>
  <text x="52" y="166" class="h">Κοινός φάκελος ΣΕΛΙΔΑ</text>
  <text x="52" y="188" class="m">\\192.168.0.221\</text>
  <text x="52" y="205" class="m">grafeio-koinos\ΣΕΛΙΔΑ</text>
  <text x="52" y="238" class="t"><tspan class="b">ΝΕΑ-ΕΡΓΑ\</tspan></text>
  <text x="52" y="258" class="s">Ένας υποφάκελος ανά έργο:</text>
  <text x="52" y="276" class="s">«Χωριό - τι είναι», με φωτογραφίες</text>
  <text x="52" y="294" class="s">JPG/PNG και ένα info.txt.</text>
  <text x="52" y="312" class="s">Τον γεμίζει όποιος θέλει στο γραφείο.</text>
  <text x="52" y="346" class="t"><tspan class="b">backup\</tspan></text>
  <text x="52" y="366" class="s">Όλο το site + ιστορικό, κάθε Δευτέρα.</text>
  <text x="52" y="400" class="t"><tspan class="b">ΔΙΑΒΑΣΕ-ΜΕ.txt</tspan></text>
  <text x="52" y="420" class="s">Οδηγίες για όλους.</text>
  <text x="52" y="458" class="s">Το site ΔΕΝ τρέχει από εδώ: εδώ</text>
  <text x="52" y="474" class="s">μόνο υλικό και αντίγραφα ασφαλείας.</text>

  <!-- CMS -->
  <rect x="360" y="136" width="330" height="158" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="360" y="136" width="8" height="158" rx="4" fill="#2563eb"/>
  <text x="382" y="166" class="h">Α. CMS (Sveltia) στον browser</text>
  <text x="382" y="190" class="t">Από οποιονδήποτε υπολογιστή:</text>
  <text x="382" y="210" class="m">…github.io/av-website/admin/</text>
  <text x="382" y="232" class="t">«Sign In Using Access Token».</text>
  <text x="382" y="258" class="t"><tspan class="b">Για:</tspan> κείμενα, τηλέφωνα, αριθμούς,</text>
  <text x="382" y="278" class="t">σειρά/απόκρυψη έργων, λίγες φωτο.</text>

  <!-- Agent -->
  <rect x="360" y="312" width="330" height="236" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="360" y="312" width="8" height="236" rx="4" fill="#7c3aed"/>
  <text x="382" y="342" class="h">Β. AI agent (Claude)</text>
  <text x="382" y="366" class="t">Claude app → φάκελος σε κάθε PC:</text>
  <text x="382" y="386" class="m">C:\Sites\av-website</text>
  <text x="382" y="412" class="t"><tspan class="b">Για:</tspan> νέο έργο από το NAS,</text>
  <text x="382" y="432" class="t">μεταφράσεις, μαζικές αλλαγές.</text>
  <text x="382" y="460" class="s">1. Φέρνει πρώτα τα νέα από GitHub (pull)</text>
  <text x="382" y="478" class="s">2. Κάνει την αλλαγή</text>
  <text x="382" y="496" class="s">3. Σου δείχνει τη σελίδα τοπικά</text>
  <text x="382" y="514" class="s">4. Ανεβαίνει μόνο όταν πεις «ναι» (push)</text>
  <text x="382" y="536" class="s">Κανόνες του agent: AGENTS.md</text>

  <!-- GitHub -->
  <rect x="740" y="186" width="220" height="250" rx="14" fill="#24292f"/>
  <text x="762" y="222" font-size="22" font-weight="700" fill="#fff">GitHub</text>
  <text x="762" y="250" font-size="15" fill="#d0d7de">Η μία αποθήκη.</text>
  <text x="762" y="276" font-size="15" fill="#d0d7de">Όλα τα αρχεία + το</text>
  <text x="762" y="296" font-size="15" fill="#d0d7de">ιστορικό κάθε αλλαγής.</text>
  <text x="762" y="322" font-size="15" fill="#d0d7de">Κάθε αλλαγή γυρίζει</text>
  <text x="762" y="342" font-size="15" fill="#d0d7de">πίσω (revert).</text>
  <text x="762" y="378" font-size="13" fill="#ffd33d" font-weight="700">Δημόσιο: τα βλέπει</text>
  <text x="762" y="396" font-size="13" fill="#ffd33d" font-weight="700">όποιος θέλει.</text>
  <text x="762" y="422" font-size="12" fill="#8c959f">civilavlachos-hub/av-website</text>

  <!-- Site online -->
  <rect x="1000" y="186" width="250" height="250" rx="14" fill="#fff" stroke="#15803d" stroke-width="2.5"/>
  <rect x="1000" y="186" width="8" height="250" rx="4" fill="#15803d"/>
  <text x="1022" y="222" class="h">Το site online</text>
  <text x="1022" y="250" class="t">GitHub Pages (δωρεάν).</text>
  <text x="1022" y="276" class="t">Χτίζεται ξανά μόνο του</text>
  <text x="1022" y="296" class="t">μετά από κάθε αλλαγή,</text>
  <text x="1022" y="316" class="t">σε <tspan class="b">1-2 λεπτά</tspan>.</text>
  <text x="1022" y="346" class="t">Αν κάτι είναι λάθος, το</text>
  <text x="1022" y="366" class="t">site μένει όπως ήταν.</text>
  <text x="1022" y="400" class="s">civilavlachos-hub.github.io/</text>
  <text x="1022" y="416" class="s">av-website/</text>

  <!-- Βέλη -->
  <path class="ln" d="M320,270 C340,270 340,400 356,400"/>
  <text x="0" y="0" class="lbl" transform="translate(337,372) rotate(-90)">διαβάζει</text>
  <path class="ln" d="M690,200 C716,200 716,250 736,250"/>
  <text x="694" y="182" class="lbl">Save</text>
  <path class="ln" d="M690,420 C716,420 716,370 736,370"/>
  <text x="696" y="446" class="lbl">push</text>
  <path class="dl" d="M740,300 C716,300 716,330 694,330"/>
  <text x="704" y="292" class="lbl">pull</text>
  <path class="ln" d="M960,311 L996,311"/>
  
  <path class="dl" d="M850,436 L850,566 L175,566 L175,488"/>
  <text x="866" y="520" class="lbl">Δευτέρα 10:00:</text>
  <text x="866" y="538" class="lbl">αντίγραφο στο NAS\backup</text>

  <!-- Πότε συγχρονίζεται -->
  <text x="30" y="600" class="k">ΠΟΤΕ ΣΥΓΧΡΟΝΙΖΕΤΑΙ ΤΙ</text>
  <rect x="30" y="614" width="740" height="250" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <text x="52" y="648" class="t"><tspan class="b">Save στο CMS</tspan> → αμέσως στο GitHub → online σε 1-2 λεπτά.</text>
  <text x="52" y="680" class="t"><tspan class="b">Agent</tspan> → πρώτα pull από GitHub· push μόνο με «ναι» → online σε 1-2 λεπτά.</text>
  <text x="52" y="712" class="t"><tspan class="b">C:\Sites\av-website</tspan> σε κάθε PC = τοπικό αντίγραφο. Ενημερώνεται</text>
  <text x="52" y="732" class="t">μόνο με pull (το κάνει ο agent πριν δουλέψει, και το backup κάθε Δευτέρα).</text>
  <text x="52" y="764" class="t"><tspan class="b">Δευτέρα 10:00</tspan> (Task Scheduler στο PC): pull + backup στο NAS\backup.</text>
  <text x="52" y="796" class="t"><tspan class="b">ΝΕΑ-ΕΡΓΑ</tspan> στο NAS: δεν ανεβαίνει μόνο του. Ο agent το διαβάζει όταν του πεις</text>
  <text x="52" y="816" class="t">«Πρόσθεσε το έργο από τον φάκελο ΝΕΑ-ΕΡΓΑ\…» ή «Τι νέο υπάρχει στο NAS;».</text>
  <text x="52" y="846" class="s">Δύο άτομα αλλάζουν το ίδιο έργο ταυτόχρονα; Ο agent το βλέπει στο pull και ρωτάει.</text>

  <!-- Πού είναι τι -->
  <text x="800" y="600" class="k">ΠΟΥ ΕΙΝΑΙ ΤΙ</text>
  <rect x="800" y="614" width="450" height="250" rx="14" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
  <text x="822" y="648" class="t"><tspan class="b">Έργα:</tspan> src/content/projects/*.el.md, *.en.md</text>
  <text x="822" y="674" class="t"><tspan class="b">Στοιχεία γραφείου:</tspan> src/data/site.json</text>
  <text x="822" y="700" class="t"><tspan class="b">Φωτογραφίες:</tspan> public/images/projects/</text>
  <text x="822" y="726" class="t"><tspan class="b">Token CMS:</tspan> .secrets\cms-token.txt</text>
  <text x="822" y="744" class="s">μόνο τοπικά + password manager, ποτέ στο GitHub</text>
  <text x="822" y="772" class="t"><tspan class="b">Φόρμα:</tspan> Web3Forms → email γραφείου</text>
  <text x="822" y="798" class="t"><tspan class="b">Νέος υπολογιστής:</tspan> SETUP.md</text>
  <text x="822" y="824" class="t"><tspan class="b">Αν χαθούν όλα:</tspan> φάκελος «ΑΝΑΚΤΗΣΗ»</text>
  <text x="822" y="846" class="s">(τυπωμένος, χωρίς κωδικούς)</text>

  <!-- Κανόνες -->
  <rect x="30" y="894" width="1220" height="180" rx="14" fill="#fff4f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="52" y="928" class="h" fill="#b91c1c">Τι πρέπει να ξέρεις</text>
  <text x="52" y="960" class="t"><tspan class="b">1.</tspan> Ό,τι αποθηκεύεις βγαίνει online σε 1-2 λεπτά.</text>
  <text x="52" y="990" class="t"><tspan class="b">2.</tspan> Ποτέ όνομα πελάτη, διεύθυνση, ΑΦΜ, αριθμό άδειας.</text>
  <text x="52" y="1020" class="t"><tspan class="b">3.</tspan> Φωτογραφίες μόνο με άδεια του πελάτη.</text>
  <text x="52" y="1050" class="t"><tspan class="b">4.</tspan> Νέο έργο με πολλές φωτογραφίες: μέσω agent (σβήνει GPS).</text>
  <text x="660" y="960" class="t"><tspan class="b">5.</tspan> Λάθος; «Γύρνα πίσω την τελευταία αλλαγή».</text>
  <text x="660" y="990" class="t"><tspan class="b">6.</tspan> Κωδικοί και tokens ποτέ στη συνομιλία με το AI.</text>
  <text x="660" y="1020" class="t"><tspan class="b">7.</tspan> Κάτι χάλασε; Ρώτα: «γιατί δεν βγήκε online;»</text>
  <text x="660" y="1050" class="t"><tspan class="b">8.</tspan> Πριν δουλέψεις στο PC: ο agent κάνει πρώτα pull.</text>
</svg>
